# fly.toml app configuration file generated for micro-saas-subscription-dashboard-wr4e-w on 2026-10-08T22:54:29Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'micro-saas-subscription-dashboard-wr4e-w'
primary_region = 'lhr'
kill_signal = 'SIGINT'
kill_timeout = '10s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'postgresql://postgres:postgres@localhost:5432/microsaas?schema=public'
  DB_TYPE = 'postgres'
  HOSTNAME = '0.0.0.0'
  NEXT_TELEMETRY_DISABLED = '1'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'microsaas_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
